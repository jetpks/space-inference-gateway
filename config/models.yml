# Model registry — alias → inference engine launch args.
# `model` is the HF repo id (or a local path) passed to the engine via --model.
# For the mlx engine, it is also the value the proxy rewrites the request "model"
# field to (mlx validates this field). For the optiq engine, the model field is a
# label — optiq's single-model mode serves any value, so no rewrite is needed.
# `venv` for mlx is the python interpreter; for optiq and mlx-vlm it is the
# engine's console-script binary path, invoked directly. All may start with
# `~` (expanded to HOME by the registry).
default: qwen3.8-27b-mxfp8-concurrent1

models:
  # mlx-vlm engine, two operating points over the same checkpoint (same port
  # 8080 — the supervisor is single-flight and swaps between them). APC has
  # no CLI flag — it's environment-only (see the supervisor's build_env) — so
  # apc_enabled/apc_exact_cache_entries must both be set or the child runs
  # with caching silently off. Size it as 2 x concurrent conversations (each
  # request stores two cache snapshots); undersizing it degrades to a 0% cache
  # hit rate silently — measured 2026-08-15, not theoretical. But a snapshot's
  # cost scales with prompt depth, so the ceiling is memory, not slots: at a
  # ~59k-token prompt, 16 slots exhausted the Metal allocation and the engine
  # raised kIOGPUCommandBufferCallbackErrorOutOfMemory mid-decode (2026-08-17).
  # Size each alias to its own max_num_seqs rather than sharing one number.
  # readiness_timeout is omitted: the default comfortably
  # covers the measured 4-7s load. decode_concurrency / prompt_concurrency
  # are omitted: they're mlx_lm-specific and mean nothing to this engine.
  #
  # -concurrent1 wins single-stream (22.5 tok/s @ concurrency 1) but
  # collapses under load (~12.5 tok/s aggregate @ concurrency >= 2) —
  # speculative decoding and continuous batching compete for the same
  # compute slack. No thinking_budget: mlx-vlm rejects draft_model +
  # thinking_budget together, per request.
  qwen3.8-27b-mxfp8-concurrent1:
    engine: mlx-vlm
    model: mlx-community/Qwen3.8-27B-mxfp8
    port: 8080
    venv: ~/.venv-mlx-vlm/bin/mlx_vlm.server
    enable_thinking: true
    apc_enabled: true
    # 4 = 2 snapshots x 2 conversations: the interactive session plus whatever
    # background classifier call rides alongside it. max_num_seqs is 1, so the
    # extra 12 slots bought nothing but memory at depth — see the OOM note above.
    apc_exact_cache_entries: 4
    draft_model: mlx-community/Qwen3.8-27B-MTP-mxfp8
    draft_kind: mtp
    max_num_seqs: 1
    supports_reasoning: true
  # -concurrent4 drops the drafter and wins batch (14.8/30.0/37.6/40.7 tok/s
  # aggregate @ concurrency 1-4) — it's also the only config where
  # thinking_budget works at all (see -concurrent1's comment). max_num_seqs:
  # 4 is a measured guard: above concurrency 4 the engine produced a
  # 16,384-token runaway and finish_reason: stop responses with 1-5
  # completion tokens and content: null — both measured 2026-08-15.
  qwen3.8-27b-mxfp8-concurrent4:
    engine: mlx-vlm
    model: mlx-community/Qwen3.8-27B-mxfp8
    port: 8080
    venv: ~/.venv-mlx-vlm/bin/mlx_vlm.server
    enable_thinking: true
    apc_enabled: true
    apc_exact_cache_entries: 16
    max_num_seqs: 4
    thinking_budget: 512
    supports_reasoning: true
  # Qwen3.8-Flash-Next — qwen4_exp, a 120B/A6B sparse-MoE VLM driven text-only,
  # in Vontra's oQ3 mixed-precision quant (86.2 GiB on disk). Measured and
  # verified working 2026-08-27.
  #
  # ⚠️ DEPENDS ON TWO LOCAL PATCHES to mlx_vlm/models/qwen4_exp/qwen4_exp.py.
  # `pip install --upgrade mlx-vlm` silently reverts both; backups alongside
  # as .orig-0.6.17 and .pre-defold. Without them this alias does not merely
  # degrade — it fails to load, or generates fluent word salad at HTTP 200.
  #   1. MTP strip. Stock filters `mtp.*`; the checkpoint names them
  #      `language_model.mtp.*`, so 76 tensors reach load_weights(strict=True)
  #      and the load fails outright.
  #   2. RMSNorm recentering. Qwen4ExpRMSNorm applies (1 + w) and expects
  #      zero-centered weights; Vontra stores them one-centered (the mlx-lm
  #      convention), so 148 norms compute ~1.9x instead of ~0.9x. Loads
  #      clean, logs nothing, generates garbage. This is a checkpoint/runtime
  #      convention mismatch, not a bad quant — re-check it before swapping
  #      to another publisher's conversion, which may already be zero-centered.
  #
  # No draft_model — now for a MEASURED reason, not a blocked one. The 27B's
  # drafter still must not be attached (different hidden dims), but mlx-vlm
  # DOES register qwen4_exp in MTP_SPLITTERS as of the rebase to upstream/main
  # (mlx_vlm/speculative/drafters/mtp_split.py), so this checkpoint's own 76
  # `language_model.mtp.*` tensors (1.53 GiB, still stripped at load) CAN be
  # split out with `python -m mlx_vlm.split_mtp`. It was, and both drafters
  # were benched engine-direct on this box, 5x256-token decodes each:
  #
  #     no drafter                        29.82 tok/s   86 GB
  #     own split MTP head (1.5 GiB)      22.97 tok/s   88 GB   -23%
  #     sh0wie bf16 drafter (4.9 GiB)     18.84 tok/s   91 GB   -37%
  #
  # Speculation genuinely engaged ("Drafter ready; speculative decoding
  # enabled"; the engine's own decode= line corroborates each figure). MTP is
  # a large net LOSS here: the drafter's own forward pass is not cheap next to
  # this trunk, so the bigger, higher-precision drafter is the WORSE one — the
  # opposite of the usual "bf16 drafter buys acceptance" reasoning. Measured
  # 2026-08-31; re-measure on M5-class hardware before assuming it still holds.
  #
  # ⚠️ mlx_vlm.split_mtp emits a drafter that does NOT load: it copies the 22
  # quantized modules' .scales/.biases but writes no `quantization` block to
  # the output config, so load() builds an unquantized model and rejects them
  # ("Received 44 parameters not in model"). Reconstructing the block from this
  # checkpoint's own `language_model.mtp.*` entries fixes it. Upstream bug,
  # unreported.
  #
  # No max_kv_size: inert here. The model defines make_cache() (12
  # full-attention QSAKVCache + 36 linear ArraysCache) and make_prompt_cache
  # defers to it, ignoring the bound. Setting it would read as a guard while
  # doing nothing.
  #
  # No kv_bits: it 500s. With quantization on, the continuous-batching path
  # builds a BatchQuantizedKVCache, which has no update_indexer, and QSA's
  # indexer raises on every generation.
  #
  # prefill_step_size is the lever that works — peak memory here is dominated
  # by prefill buffers, not the cache. Measured, same prompts:
  #     prompt   default 2048    512
  #        8k     95.06 GiB    87.97 GiB
  #       32k    120.53 GiB    95.15 GiB   <- default exceeds the wired limit
  #       64k          —      104.65 GiB
  # Throughput did not suffer for the reduction.
  #
  # ⚠️ Practical context ceiling is ~64k, not the model's 262k: 64k peaks at
  # 104.65 GiB against a 112 GiB wired limit, and 128k thrashes and times out.
  # Keep clients under that.
  #
  # reasoning_effort is the *template's* vocabulary, not OpenAI's: this template
  # raises on anything but xhigh/medium/low, which would turn a stock client's
  # "high" into a 500. The gateway coerces to reasoning_effort_values, defaulting
  # to medium — the template's own default is xhigh, which is a lot of reasoning
  # to spend by accident on a box this size.
  qwen3.8-flash-next-oq3:
    engine: mlx-vlm
    model: Vontra/Qwen3.8-Flash-Next-MLX-oQ3-MTP
    port: 8080
    venv: ~/.venv-mlx-vlm/bin/mlx_vlm.server
    enable_thinking: true
    supports_reasoning: true
    reasoning_effort: medium
    reasoning_effort_values: [xhigh, medium, low]
    # Anthropic's five effort levels land on this template's three (used by
    # the ANT path's output_config.effort translation). high -> medium is
    # deliberate: Claude Code sends "high" when CLAUDE_CODE_EFFORT_LEVEL is
    # unset, so this is what an out-of-the-box claude-local turn gets, and
    # medium is this alias's own chosen default above. max -> xhigh is the
    # one case plain reasoning_effort_values coercion gets wrong (it would
    # land on medium).
    reasoning_effort_map:
      low: low
      medium: medium
      high: medium
      xhigh: xhigh
      max: xhigh
    # Qwen templates replay each prior turn's full chain-of-thought into the
    # prompt unless told otherwise, growing context by reasoning rather than by
    # answers. mlx-vlm does not forward preserve_thinking, so the gateway drops
    # reasoning_content from history instead.
    preserve_thinking: false
    prefill_step_size: 512
    apc_enabled: true
    apc_exact_cache_entries: 2
    max_num_seqs: 1
    # A 64k prefill runs ~370s at the measured 173.7 tok/s; the 600s default
    # leaves little margin, and it is a per-token wait, not a total budget.
    token_queue_timeout: 1200
    # 86 GiB off a cold page cache is well past the default 120s budget.
    # (Measured ~30s warm; the budget is for the cold case.)
    readiness_timeout: 600


  # Qwen3.8-Flash-Next REAP-288 — the same qwen4_exp 125B/A6B sparse-MoE VLM as
  # the oQ3 alias above, but with 288 of 512 experts per MoE layer pruned out by
  # REAP saliency (calibrated by the publisher on ~686K tokens of agentic-coding
  # traffic; source revision f5d08274, kept-expert manifest ships in the repo).
  # 68.44 GiB on disk against oQ3's 86.15 GiB. Downloaded and integrity-checked
  # 2026-08-31: 131/131 shards, 3743 tensors, no missing shards.
  #
  # Why it is here: MEMORY, not speed. MoE decode is bound by bytes-read-per-
  # token, and top-k is still 10 — pruning cuts the *total* expert count, not
  # the per-token read, while 3-bit -> 4-bit raises expert bytes ~33%. The
  # publisher measures ~28 tok/s on stock mlx-vlm against our measured 29.65 on
  # oQ3, so expect this alias to be SLOWER. It buys ~87 GB -> ~68 GB resident
  # (and ~39 GB if PLE streaming engages), at a published 93.9% -> 91.5%
  # HumanEval. See notes/2026-08-31-reap-288-trial.md in the space.
  #
  # NEEDS NO LOADER PATCHES, unlike the oQ3 alias above. The publisher fixed
  # both conversion defects in the weights (RMSNorm re-centered, shard_N ->
  # shards.N). Verified against the bytes, not the card: the median mean of its
  # Qwen4ExpRMSNorm weights is -0.076 (Vontra's is +1.134), so
  # `norm_weights_are_one_centered` returns false and our un-folding patch
  # correctly no-ops. The patch is still required for the oQ3 alias.
  #
  # No draft_model. The checkpoint ships no mtp.* tensors (verified: 3743
  # tensors, mtp=0), so it could only use the standalone bf16 drafter — and
  # that was measured on the oq3 alias above and costs 37% of decode. The
  # publisher's "roughly break-even on M4" is optimistic for this box.
  #
  # ⚠️ NOT A GENERAL-PURPOSE ALIAS. On bare prompts with thinking off it
  # answers "implement this Ruby method" with <tool_call><function=list_files>
  # and stops at ~61 tokens: 27/30 drift against oq3's 0/30, same engine, same
  # prompts, k=3 (canary, 2026-08-31). Both rescues are total — thinking on
  # (6/6 ok) or any system prompt (36/36 ok) — and Claude Code supplies both,
  # which is why this alias stays. The likely cause is on the publisher's card:
  # experts pruned by saliency calibrated on ~686K tokens of agentic-coding
  # traffic, with the stated caveat that retention is not general-domain.
  #
  # ple_storage is declared in the checkpoint's own config
  # ({manifest: ple-store.json, cache_rows: 0}) and PR #2045 is merged in our
  # mlx-vlm tree, so the n-gram table may stream rather than stay resident —
  # unmeasured, and the reason to watch phys_footprint on first load.
  # NEVER re-save a shard of this checkpoint: ple-store.json addresses the
  # n-gram table by absolute byte offsets that bypass the safetensors header,
  # so a rewrite yields NaN logits even with bit-identical tensors.
  #
  # Every other key below is carried over from qwen3.8-flash-next-oq3 verbatim
  # (same chat template, so the same three-value reasoning vocabulary applies).
  # prefill_step_size stays 512 on purpose: its memory table was measured on the
  # 86 GiB build and wants re-deriving here, but changing it now would confound
  # the checkpoint swap with a tuning change.
  qwen3.8-flash-next-reap288:
    engine: mlx-vlm
    model: sh0wie/Qwen3.8-Flash-Next-REAP-288-MLX-4bit
    port: 8080
    venv: ~/.venv-mlx-vlm/bin/mlx_vlm.server
    enable_thinking: true
    supports_reasoning: true
    reasoning_effort: medium
    reasoning_effort_values: [xhigh, medium, low]
    reasoning_effort_map:
      low: low
      medium: medium
      high: medium
      xhigh: xhigh
      max: xhigh
    preserve_thinking: false
    prefill_step_size: 512
    apc_enabled: true
    apc_exact_cache_entries: 2
    max_num_seqs: 1
    token_queue_timeout: 1200
    readiness_timeout: 600
  # Qwen3.8-Flash-Next REAM-288 — WaveCut's derivative of the sh0wie REAP-288
  # build above. Same 288 slots and the same file layout; the 224 non-kept
  # experts per layer are MERGED into their nearest surviving expert
  # (arXiv 2604.04356, Samsung SAIL Montreal) rather than dropped. Verified
  # 2026-08-31 against sh0wie's repo: 35 shards byte-identical, 96 rewritten,
  # and only the 432 switch_mlp expert tensors differ — every non-expert
  # tensor, including the RMSNorm fixes, is bit-identical.
  #
  # Differs from qwen3.8-flash-next-reap288 in `model` ONLY, deliberately: the
  # merge-vs-prune comparison is the entire reason this alias exists, so it
  # must not also differ in sampling. In particular it carries NO penalties,
  # matching reap288 — adding them here would confound the comparison with
  # the very knob the a3b arms are testing.
  #
  # The publisher's own paired A/B found merge and prune statistically
  # indistinguishable on HumanEval-164 (89.6 vs 89.0, McNemar p = 1.000) and
  # GSM8K-200 (58.0 vs 56.0, p = 0.585), with only a small KL edge surviving.
  # Both are Python/maths benchmarks; whether that holds on a Ruby corpus is
  # exactly what canary is being pointed at here.
  qwen3.8-flash-next-ream288:
    engine: mlx-vlm
    model: WaveCut/Qwen3.8-Flash-Next-REAM-288-MLX-4bit
    port: 8080
    venv: ~/.venv-mlx-vlm/bin/mlx_vlm.server
    enable_thinking: true
    supports_reasoning: true
    reasoning_effort: medium
    reasoning_effort_values: [xhigh, medium, low]
    reasoning_effort_map:
      low: low
      medium: medium
      high: medium
      xhigh: xhigh
      max: xhigh
    preserve_thinking: false
    prefill_step_size: 512
    apc_enabled: true
    apc_exact_cache_entries: 2
    max_num_seqs: 1
    token_queue_timeout: 1200
    readiness_timeout: 600

  # Qwen3.6 27B OptiQ-4bit with MTP depth 2 (optiq engine).
  # optiq's single-model mode: the request "model" field is a label — any value
  # is accepted, so the proxy does not rewrite it for this engine.
  qwen3-27b-optiq:
    engine: optiq
    model: mlx-community/Qwen3.6-27B-OptiQ-4bit
    port: 8080
    # venv is the optiq binary, not a python interpreter.
    venv: ~/.venv-optiq/bin/optiq
    mtp: true
    mtp_depth: 2
    max_concurrent: 8
  # Dense 70B (Llama-3.3 base, Nous instruct finetune). Hermes 4 IS a hybrid
  # reasoner — its template defines a thinking_prompt and wraps output in
  # <think></think> — but the toggle is a template variable named `thinking`,
  # and NOTHING here can reach it: mlx-vlm's to_template_kwargs emits
  # enable_thinking/reasoning/reasoning_effort and never `thinking`, and the
  # legacy mlx engine has no launch flag for it either. So thinking is off,
  # and supports_reasoning: false keeps the normalizer in passthrough rather
  # than hunting for tags that will never arrive.
  #
  # Correcting an earlier comment here that read "no native reasoning": the
  # capability exists, the plumbing to switch it on does not. Enabling it
  # needs `thinking` added to to_template_kwargs in the mlx-vlm fork.
  hermes-4-70b:
    engine: mlx
    model: mlx-community/Hermes-4-70B-6bit
    port: 8080
    venv: ~/.venv-vllm-metal/bin/python
    decode_concurrency: 8
    prompt_concurrency: 4
    supports_reasoning: false
    # mlx_lm 0.31.3 bug: the eos_token_id-based stop (via
    # tokenizer.eos_token_ids in the SequenceStateMachine) does not fire for
    # this model — the server generates past <|eot_id|> (128009) without
    # stopping. Injecting it as an explicit stop sequence works around the
    # bug (string-based stop detection is unaffected).
    stop_tokens:
      - <|eot_id|>
  # Qwen3.5-122B-A10B (model_type qwen3_5_moe, 256 experts, 262k text ctx) —
  # moved from the mlx engine to mlx-vlm 2026-09-01, same rationale as the a3b
  # arms above: mlx-vlm implements qwen3_5_moe, so the weights load unchanged
  # and only the serving vocabulary differs.
  #
  # Thinking ON. Under the legacy mlx engine this alias never carried
  # supports_reasoning while its template defaulted thinking on, so it emitted
  # raw <think> tags into content with nothing lifting them. Both halves are
  # fixed here rather than by muting the model: enable_thinking makes the
  # launch flag explicit, supports_reasoning routes the output.
  #
  # Measured 2026-09-01 against the live REAM-288 arm: mlx-vlm splits thinking
  # into a `reasoning_content` FIELD server-side (content came back as bare
  # "391", no tags). So the Qwen template pre-opening <think> in the prompt —
  # which would defeat ReasoningParser, since it only enters :thinking on an
  # OPENING tag it will never see — does not matter on this engine. It would
  # matter on the mlx engine, which does no such splitting.
  qwen3-122b-a10b:
    engine: mlx-vlm
    model: mlx-community/Qwen3.5-122B-A10B-4bit
    port: 8080
    venv: ~/.venv-mlx-vlm/bin/mlx_vlm.server
    enable_thinking: true
    supports_reasoning: true
    max_num_seqs: 1
    # 65 GiB off a cold page cache — the same class as the flash-next oQ3 alias
    # above, whose 600s budget is measured. The 300s here was inherited from the
    # mlx engine and never measured against a cold load.
    readiness_timeout: 600
  # Qwen3.5-35B-A3B — moved to mlx-vlm 2026-09-01 alongside its 3.6 siblings
  # below. Same model_type (qwen3_5_moe), same reason: it is a thinking model,
  # and the legacy mlx engine has no launch-level thinking switch.
  qwen3-35b-a3b:
    engine: mlx-vlm
    model: mlx-community/Qwen3.5-35B-A3B-4bit
    port: 8080
    venv: ~/.venv-mlx-vlm/bin/mlx_vlm.server
    enable_thinking: true
    supports_reasoning: true
    max_num_seqs: 1
  # Qwen3.6-35B-A3B, both quants — moved from the mlx engine to mlx-vlm
  # 2026-09-01 (model_type qwen3_5_moe, which mlx-vlm implements, so the
  # weights load unchanged and only the serving vocabulary differs).
  #
  # Why move: these are reasoning models, and under mlx_lm.server the only
  # lever over their thinking was chat_template_kwargs, forwarded per request.
  # That left them running past the 16,384-token cap on some prompts even with
  # thinking off, which is why they have never produced a usable eval arm.
  #
  # Thinking ON as of 2026-09-01, and the runaway is now bounded by the knob
  # that actually means it. thinking_budget forces "\n</think>" once the
  # THINKING span exceeds it (utils.py ThinkingBudget), leaving the answer
  # unbounded — and it works with the Qwen template pre-opening <think> in the
  # prompt, because the server detects that case (_prompt_has_open_thinking).
  # 4096 is a starting point sized to leave most of a 16k budget for the
  # answer, not a measured result.
  #
  # ⚠️ Sampling penalties REMOVED 2026-09-01. These arms are for code, and a
  # repetition penalty is the wrong instrument there: over a 64-token window,
  # 1.05 penalises indentation, closing delimiters and an identifier named
  # once per line — all correct output, not degeneration. They were only ever
  # standing in for a length bound, which thinking_budget now provides
  # directly. Removing them also restores comparability with the flash-next
  # arms, which deliberately carry none.
  #
  # decode_concurrency/prompt_concurrency dropped: mlx_lm-specific, and
  # meaningless to this engine.
  qwen3.6-35b-a3b-4bit:
    engine: mlx-vlm
    model: mlx-community/Qwen3.6-35B-A3B-4bit
    port: 8080
    venv: ~/.venv-mlx-vlm/bin/mlx_vlm.server
    enable_thinking: true
    supports_reasoning: true
    thinking_budget: 4096
    max_num_seqs: 1
  qwen3.6-35b-a3b-8bit:
    engine: mlx-vlm
    model: mlx-community/Qwen3.6-35B-A3B-8bit
    port: 8080
    venv: ~/.venv-mlx-vlm/bin/mlx_vlm.server
    enable_thinking: true
    supports_reasoning: true
    thinking_budget: 4096
    max_num_seqs: 1
  # MoE 120B/A12B (Nemotron 3 Super, q5). Custom NemotronH architecture.
  # Registered after a guided-ops trial 2026-07-18: loaded and served through
  # the TLS edge, reasoning_content separated, finish_reason stop.
  #
  # Moved from the mlx engine to mlx-vlm 2026-09-01: mlx-vlm implements
  # nemotron_h (mlx_vlm/models/nemotron_h), so the weights load unchanged and
  # only the serving vocabulary differs.
  #
  # enable_thinking is PRESENT here, unlike the a3b arms and the 122B above.
  # This alias is a reasoning arm today — supports_reasoning: true, tags lifted
  # by the parser — and on mlx-vlm the flag is the whole-child switch, so
  # omitting it would silently turn thinking off and change what this alias is.
  nemotron-3-super:
    engine: mlx-vlm
    model: mlx-community/NVIDIA-Nemotron-3-Super-120B-A12B-5bit
    port: 8080
    venv: ~/.venv-mlx-vlm/bin/mlx_vlm.server
    enable_thinking: true
    supports_reasoning: true
    max_num_seqs: 1
    # 77 GiB cold — see the 122B's readiness_timeout note above.
    readiness_timeout: 600
  # Qwen3-Coder-Next, q6 (model_type qwen3_next — 48 layers, 512 experts, 262k
  # ctx; the same architecture family mlx-vlm already serves for the flash-next
  # MTP drafter work). Registered 2026-09-01, previously on disk with no alias.
  #
  # Coder-specialised instruct model: its chat template carries no <think>,
  # </think> or enable_thinking markers at all, so supports_reasoning is false
  # and enable_thinking is absent — there is no thinking channel to gate.
  #
  # No `penalties:` block on purpose. A repetition penalty is actively wrong for
  # code, where repeated tokens — indentation, closing delimiters, an identifier
  # named once per line — are correct output rather than degeneration.
  qwen3-coder-next:
    engine: mlx-vlm
    model: mlx-community/Qwen3-Coder-Next-6bit
    port: 8080
    venv: ~/.venv-mlx-vlm/bin/mlx_vlm.server
    supports_reasoning: false
    max_num_seqs: 1
    # 60 GiB cold — see the 122B's readiness_timeout note above.
    readiness_timeout: 600
  # ── Small arms, 4-10 GiB, registered 2026-09-01 ───────────────────────────
  # Pulled to give canary a consumer-class band under the 60-120 GiB arms
  # above. Deliberately three model FAMILIES rather than three Qwen quants:
  # canary's thesis is generalization vs memorization, and Qwen-vs-Qwen mostly
  # measures scale, while Gemma, Mistral, Olmo and Granite carry independent
  # training mixes. Every arch already ships in the fork.
  #
  # No readiness_timeout: all five load well inside the 120s default.

  # Qwen3.5-9B (qwen3_5). Thinking model, standard <think> markers - the small
  # sibling of the 122B arm, so the pair reads as a size gradient in one family.
  qwen3.5-9b:
    engine: mlx-vlm
    model: mlx-community/Qwen3.5-9B-MLX-4bit
    port: 8080
    venv: ~/.venv-mlx-vlm/bin/mlx_vlm.server
    enable_thinking: true
    supports_reasoning: true
    max_num_seqs: 1

  # Gemma 4 E4B (gemma4, MatFormer "effective 4B"). Thinking model, but NOT via
  # <think>: its template opens '<|think|>' and renders tool-call reasoning as
  # '<|channel>thought ... <channel|>'. mlx-vlm handles both natively -
  # _split_thinking tries the tokenizer's own parse_response first and falls
  # back to a marker set that already knows this shape (server/app.py's
  # _count_thinking_tag_tokens names it explicitly).
  #
  # Verified live 2026-09-01 rather than assumed, because a non-<think> thinking
  # model is exactly where the gateway's own ReasoningParser would fail: probed
  # direct on :8081 with --enable-thinking, reasoning_content came back with 658
  # characters, content was bare "391", and no marker leaked into content.
  gemma-4-e4b:
    engine: mlx-vlm
    model: mlx-community/gemma-4-e4b-it-4bit
    port: 8080
    venv: ~/.venv-mlx-vlm/bin/mlx_vlm.server
    enable_thinking: true
    supports_reasoning: true
    max_num_seqs: 1

  # Ministral 3 8B (mistral3 - the arch, despite the model name). Non-thinking
  # instruct: no <think>, <|think|> or enable_thinking marker in its template.
  ministral-3-8b:
    engine: mlx-vlm
    model: mlx-community/Ministral-3-8B-Instruct-2512-4bit
    port: 8080
    venv: ~/.venv-mlx-vlm/bin/mlx_vlm.server
    supports_reasoning: false
    max_num_seqs: 1

  # Olmo 3 7B Instruct (olmo3). Non-thinking. Carried for a reason popularity
  # does not capture: it is the only fully-open-DATA model here, so its Ruby
  # contamination can be inspected directly rather than inferred - see canary's
  # docs/CONTAMINATION.md.
  olmo-3-7b:
    engine: mlx-vlm
    model: mlx-community/Olmo-3-7B-Instruct-4bit
    port: 8080
    venv: ~/.venv-mlx-vlm/bin/mlx_vlm.server
    supports_reasoning: false
    max_num_seqs: 1

  # Granite 4.1 8B (granite). Non-thinking. IBM's current small instruct.
  granite-4.1-8b:
    engine: mlx-vlm
    model: mlx-community/granite-4.1-8b-4bit
    port: 8080
    venv: ~/.venv-mlx-vlm/bin/mlx_vlm.server
    supports_reasoning: false
    max_num_seqs: 1

  # Muse Glimmer 30B (muse_glimmer, mxfp8, 131k ctx). Registered 2026-09-01.
  #
  # mxfp8 over the 8bit sibling: both are 8 bits, but mxfp8 is OCP
  # Microscaling (FP8 elements, one shared power-of-two scale per 32-weight
  # block) against affine int8 (scale+bias per 64-weight group). That is
  # 8.25 bits/weight vs 8.5, which the published sizes confirm — 30.27 vs
  # 31.08 GiB, a ratio of 0.974 against the 0.971 the arithmetic predicts.
  # Per-element exponents also degrade more gracefully around outliers than
  # one linear scale shared across 64 weights. And it is the proven path
  # here: qwen3.8-27b-mxfp8 is this box's default alias.
  #
  # An "Onyx ATEM" channel format, NOT a <think> model. Reasoning is addressed
  # to a recipient — `<|start|>assistant to=self<|message|>…<|eom|>` — and the
  # answer to `to=user`. Its own config.py declares the delimiters
  # (thinking_start_token "to=self<|message|>", thinking_end_token "<|eom|>"),
  # but server/generation.py resolves those as `args.thinking_start_token or
  # DEFAULT_THINKING_START_TOKEN` and never consults the model config — so on
  # paper the split should fall back to <think> markers that never appear.
  #
  # Measured on :8081 rather than assumed, twice: with and without those
  # markers passed explicitly. Byte-identical results — reasoning_content
  # present at 279 chars, content a clean "17 × 23 = 391", zero marker
  # leakage. tokenizer.parse_response handles it before the marker fallback is
  # reached, so declaring thinking_start_token/thinking_end_token here would
  # be a knob that does nothing.
  #
  # ⚠️ enable_thinking is ABSENT because this template does not read it.
  # Reasoning here is a SYSTEM-PROMPT instruction — render_reasoning() emits
  # the literal "Reasoning strength: {rs}." with rs defaulting to 'high' — so
  # there is no structural switch to flip, unlike Qwen's enable_thinking which
  # closes the think block in the template. Measured effort response on one
  # prompt: high 1777 reasoning chars / 482 completion tokens, low 585 / 189,
  # none 348 / 129. It modulates but never reaches zero: "none" is a
  # suggestion this model partly ignores. Any arm comparing it against a
  # Qwen "none" arm is not comparing like with like.
  muse-glimmer-30b:
    engine: mlx-vlm
    model: mlx-community/Muse-Glimmer-30B-mxfp8
    port: 8080
    venv: ~/.venv-mlx-vlm/bin/mlx_vlm.server
    supports_reasoning: true
    max_num_seqs: 1
    # 30 GiB cold — same class as the arms above, and a deadline costs nothing.
    readiness_timeout: 600
