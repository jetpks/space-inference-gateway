# Model registry — alias → inference engine launch args.
# `model` is the HF repo id (or a local path) passed to the engine via --model.
# For the mlx engine, it is also the value the proxy rewrites the request "model"
# field to (mlx validates this field). For the optiq engine, the model field is a
# label — optiq's single-model mode serves any value, so no rewrite is needed.
# `venv` for mlx is the python interpreter; for optiq and mlx-vlm it is the
# engine's console-script binary path, invoked directly. All may start with
# `~` (expanded to HOME by the registry).
default: qwen3.8-27b-mxfp8-concurrent1

models:
  # mlx-vlm engine, two operating points over the same checkpoint (same port
  # 8080 — the supervisor is single-flight and swaps between them). APC has
  # no CLI flag — it's environment-only (see the supervisor's build_env) — so
  # apc_enabled/apc_exact_cache_entries must both be set or the child runs
  # with caching silently off. apc_exact_cache_entries: 16 is 2 x concurrent
  # conversations (each request stores two cache snapshots); undersizing it
  # degrades to a 0% cache hit rate silently — measured 2026-08-15, not
  # theoretical. readiness_timeout is omitted: the default comfortably
  # covers the measured 4-7s load. decode_concurrency / prompt_concurrency
  # are omitted: they're mlx_lm-specific and mean nothing to this engine.
  #
  # -concurrent1 wins single-stream (22.5 tok/s @ concurrency 1) but
  # collapses under load (~12.5 tok/s aggregate @ concurrency >= 2) —
  # speculative decoding and continuous batching compete for the same
  # compute slack. No thinking_budget: mlx-vlm rejects draft_model +
  # thinking_budget together, per request.
  qwen3.8-27b-mxfp8-concurrent1:
    engine: mlx-vlm
    model: mlx-community/Qwen3.8-27B-mxfp8
    port: 8080
    venv: ~/.venv-mlx-vlm/bin/mlx_vlm.server
    enable_thinking: true
    apc_enabled: true
    apc_exact_cache_entries: 16
    draft_model: mlx-community/Qwen3.8-27B-MTP-mxfp8
    draft_kind: mtp
    max_num_seqs: 1
    supports_reasoning: true
  # -concurrent4 drops the drafter and wins batch (14.8/30.0/37.6/40.7 tok/s
  # aggregate @ concurrency 1-4) — it's also the only config where
  # thinking_budget works at all (see -concurrent1's comment). max_num_seqs:
  # 4 is a measured guard: above concurrency 4 the engine produced a
  # 16,384-token runaway and finish_reason: stop responses with 1-5
  # completion tokens and content: null — both measured 2026-08-15.
  qwen3.8-27b-mxfp8-concurrent4:
    engine: mlx-vlm
    model: mlx-community/Qwen3.8-27B-mxfp8
    port: 8080
    venv: ~/.venv-mlx-vlm/bin/mlx_vlm.server
    enable_thinking: true
    apc_enabled: true
    apc_exact_cache_entries: 16
    max_num_seqs: 4
    thinking_budget: 512
    supports_reasoning: true
  # Qwen3.6 27B OptiQ-4bit with MTP depth 2 (optiq engine).
  # optiq's single-model mode: the request "model" field is a label — any value
  # is accepted, so the proxy does not rewrite it for this engine.
  qwen3-27b-optiq:
    engine: optiq
    model: mlx-community/Qwen3.6-27B-OptiQ-4bit
    port: 8080
    # venv is the optiq binary, not a python interpreter.
    venv: ~/.venv-optiq/bin/optiq
    mtp: true
    mtp_depth: 2
    max_concurrent: 8
  # Dense 70B (Llama-3.3 base, Nous instruct finetune). No native reasoning —
  # the chat template emits content only, so supports_reasoning: false keeps
  # the normalizer in passthrough (no <think>/reasoning-field extraction).
  hermes-4-70b:
    engine: mlx
    model: mlx-community/Hermes-4-70B-6bit
    port: 8080
    venv: ~/.venv-vllm-metal/bin/python
    decode_concurrency: 8
    prompt_concurrency: 4
    supports_reasoning: false
    # mlx_lm 0.31.3 bug: the eos_token_id-based stop (via
    # tokenizer.eos_token_ids in the SequenceStateMachine) does not fire for
    # this model — the server generates past <|eot_id|> (128009) without
    # stopping. Injecting it as an explicit stop sequence works around the
    # bug (string-based stop detection is unaffected).
    stop_tokens:
      - <|eot_id|>
  deepseek-r1-70b:
    engine: mlx
    model: mlx-community/DeepSeek-R1-Distill-Llama-70B-6bit
    port: 8080
    venv: ~/.venv-vllm-metal/bin/python
    decode_concurrency: 8
    prompt_concurrency: 4
    # Reasoning model — emits <think>...</think> tags. The proxy's reasoning
    # parser (Phase-1 <think> path) lifts these into the reasoning channel.
    supports_reasoning: true
    # Same mlx_lm eos-stop bug precaution as hermes-4-70b (Llama-3.3 tokenizer).
    stop_tokens:
      - <|eot_id|>
  qwen3-122b-a10b:
    engine: mlx
    model: mlx-community/Qwen3.5-122B-A10B-4bit
    port: 8080
    venv: ~/.venv-vllm-metal/bin/python
    decode_concurrency: 32
    prompt_concurrency: 8
    # ~122B params — the default 120s readiness budget kills a legitimately
    # loading model of this size before it's had a chance to come up.
    readiness_timeout: 300
  qwen3-35b-a3b:
    engine: mlx
    model: mlx-community/Qwen3.5-35B-A3B-4bit
    port: 8080
    venv: ~/.venv-vllm-metal/bin/python
    decode_concurrency: 32
    prompt_concurrency: 8
  # Qwen3.6 35B A3B (model_type qwen3_5_moe — same arch family as the 3.5
  # MoE above, runs on the pinned mlx_lm 0.31.3).
  qwen3.6-35b-a3b-4bit:
    engine: mlx
    model: mlx-community/Qwen3.6-35B-A3B-4bit
    port: 8080
    venv: ~/.venv-vllm-metal/bin/python
    decode_concurrency: 32
    prompt_concurrency: 8
  qwen3.6-35b-a3b-8bit:
    engine: mlx
    model: mlx-community/Qwen3.6-35B-A3B-8bit
    port: 8080
    venv: ~/.venv-vllm-metal/bin/python
    decode_concurrency: 32
    prompt_concurrency: 8
  # MoE 120B/A12B (Nemotron 3 Super, q5). Custom NemotronH architecture —
  # mlx_lm 0.31.3 ships nemotron_h support. Reasoning model: emits thinking
  # tags the proxy's parser lifts into the reasoning channel. Registered after
  # a guided-ops trial 2026-07-18: loaded and served through the TLS edge,
  # reasoning_content separated, finish_reason stop.
  nemotron-3-super:
    engine: mlx
    model: mlx-community/NVIDIA-Nemotron-3-Super-120B-A12B-5bit
    port: 8080
    venv: ~/.venv-vllm-metal/bin/python
    decode_concurrency: 32
    prompt_concurrency: 8
    supports_reasoning: true
    # ~120B params — see qwen3-122b-a10b's readiness_timeout comment above.
    readiness_timeout: 300
