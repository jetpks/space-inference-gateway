# Model registry — alias → inference engine launch args.
# `model` is the HF repo id (or a local path) passed to the engine via --model.
# For the mlx engine, it is also the value the proxy rewrites the request "model"
# field to (mlx validates this field). For the optiq engine, the model field is a
# label — optiq's single-model mode serves any value, so no rewrite is needed.
# `venv` for mlx is the python interpreter; for optiq and mlx-vlm it is the
# engine's console-script binary path, invoked directly. All may start with
# `~` (expanded to HOME by the registry).
default: qwen3.8-27b-mxfp8-concurrent1

models:
  # mlx-vlm engine, two operating points over the same checkpoint (same port
  # 8080 — the supervisor is single-flight and swaps between them). APC has
  # no CLI flag — it's environment-only (see the supervisor's build_env) — so
  # apc_enabled/apc_exact_cache_entries must both be set or the child runs
  # with caching silently off. Size it as 2 x concurrent conversations (each
  # request stores two cache snapshots); undersizing it degrades to a 0% cache
  # hit rate silently — measured 2026-08-15, not theoretical. But a snapshot's
  # cost scales with prompt depth, so the ceiling is memory, not slots: at a
  # ~59k-token prompt, 16 slots exhausted the Metal allocation and the engine
  # raised kIOGPUCommandBufferCallbackErrorOutOfMemory mid-decode (2026-08-17).
  # Size each alias to its own max_num_seqs rather than sharing one number.
  # readiness_timeout is omitted: the default comfortably
  # covers the measured 4-7s load. decode_concurrency / prompt_concurrency
  # are omitted: they're mlx_lm-specific and mean nothing to this engine.
  #
  # -concurrent1 wins single-stream (22.5 tok/s @ concurrency 1) but
  # collapses under load (~12.5 tok/s aggregate @ concurrency >= 2) —
  # speculative decoding and continuous batching compete for the same
  # compute slack. No thinking_budget: mlx-vlm rejects draft_model +
  # thinking_budget together, per request.
  qwen3.8-27b-mxfp8-concurrent1:
    engine: mlx-vlm
    model: mlx-community/Qwen3.8-27B-mxfp8
    port: 8080
    venv: ~/.venv-mlx-vlm/bin/mlx_vlm.server
    enable_thinking: true
    apc_enabled: true
    # 4 = 2 snapshots x 2 conversations: the interactive session plus whatever
    # background classifier call rides alongside it. max_num_seqs is 1, so the
    # extra 12 slots bought nothing but memory at depth — see the OOM note above.
    apc_exact_cache_entries: 4
    draft_model: mlx-community/Qwen3.8-27B-MTP-mxfp8
    draft_kind: mtp
    max_num_seqs: 1
    supports_reasoning: true
  # -concurrent4 drops the drafter and wins batch (14.8/30.0/37.6/40.7 tok/s
  # aggregate @ concurrency 1-4) — it's also the only config where
  # thinking_budget works at all (see -concurrent1's comment). max_num_seqs:
  # 4 is a measured guard: above concurrency 4 the engine produced a
  # 16,384-token runaway and finish_reason: stop responses with 1-5
  # completion tokens and content: null — both measured 2026-08-15.
  qwen3.8-27b-mxfp8-concurrent4:
    engine: mlx-vlm
    model: mlx-community/Qwen3.8-27B-mxfp8
    port: 8080
    venv: ~/.venv-mlx-vlm/bin/mlx_vlm.server
    enable_thinking: true
    apc_enabled: true
    apc_exact_cache_entries: 16
    max_num_seqs: 4
    thinking_budget: 512
    supports_reasoning: true
  qwen3-27b-optiq:
    engine: optiq
    model: mlx-community/Qwen3.6-27B-OptiQ-4bit
    port: 8080
    # venv is the optiq binary, not a python interpreter.
    venv: ~/.venv-optiq/bin/optiq
    mtp: true
    mtp_depth: 2
    max_concurrent: 8
  qwen3-122b-a10b:
    engine: mlx-vlm
    model: mlx-community/Qwen3.5-122B-A10B-4bit
    port: 8080
    venv: ~/.venv-mlx-vlm/bin/mlx_vlm.server
    enable_thinking: true
    supports_reasoning: true
    max_num_seqs: 1
    # 65 GiB off a cold page cache — the same class as the flash-next oQ3 alias
    # above, whose 600s budget is measured. The 300s here was inherited from the
    # mlx engine and never measured against a cold load.
    readiness_timeout: 600
  # Qwen3.5-35B-A3B — moved to mlx-vlm 2026-09-01 alongside its 3.6 siblings
  # below. Same model_type (qwen3_5_moe), same reason: it is a thinking model,
  # and the legacy mlx engine has no launch-level thinking switch.
  qwen3-35b-a3b:
    engine: mlx-vlm
    model: mlx-community/Qwen3.5-35B-A3B-4bit
    port: 8080
    venv: ~/.venv-mlx-vlm/bin/mlx_vlm.server
    enable_thinking: true
    supports_reasoning: true
    max_num_seqs: 1
  # Qwen3.6-35B-A3B, both quants — moved from the mlx engine to mlx-vlm
  # 2026-09-01 (model_type qwen3_5_moe, which mlx-vlm implements, so the
  # weights load unchanged and only the serving vocabulary differs).
  #
  # Why move: these are reasoning models, and under mlx_lm.server the only
  # lever over their thinking was chat_template_kwargs, forwarded per request.
  # That left them running past the 16,384-token cap on some prompts even with
  # thinking off, which is why they have never produced a usable eval arm.
  #
  # Thinking ON as of 2026-09-01, and the runaway is now bounded by the knob
  # that actually means it. thinking_budget forces "\n</think>" once the
  # THINKING span exceeds it (utils.py ThinkingBudget), leaving the answer
  # unbounded — and it works with the Qwen template pre-opening <think> in the
  # prompt, because the server detects that case (_prompt_has_open_thinking).
  # 4096 is a starting point sized to leave most of a 16k budget for the
  # answer, not a measured result.
  #
  # ⚠️ Sampling penalties REMOVED 2026-09-01. These arms are for code, and a
  # repetition penalty is the wrong instrument there: over a 64-token window,
  # 1.05 penalises indentation, closing delimiters and an identifier named
  # once per line — all correct output, not degeneration. They were only ever
  # standing in for a length bound, which thinking_budget now provides
  # directly. Removing them also restores comparability with the flash-next
  # arms, which deliberately carry none.
  #
  # decode_concurrency/prompt_concurrency dropped: mlx_lm-specific, and
  # meaningless to this engine.
  qwen3.6-35b-a3b-4bit:
    engine: mlx-vlm
    model: mlx-community/Qwen3.6-35B-A3B-4bit
    port: 8080
    venv: ~/.venv-mlx-vlm/bin/mlx_vlm.server
    enable_thinking: true
    supports_reasoning: true
    thinking_budget: 4096
    max_num_seqs: 1
  qwen3.6-35b-a3b-8bit:
    engine: mlx-vlm
    model: mlx-community/Qwen3.6-35B-A3B-8bit
    port: 8080
    venv: ~/.venv-mlx-vlm/bin/mlx_vlm.server
    enable_thinking: true
    supports_reasoning: true
    thinking_budget: 4096
    max_num_seqs: 1
  # MoE 120B/A12B (Nemotron 3 Super, q5). Custom NemotronH architecture.
  # Registered after a guided-ops trial 2026-07-18: loaded and served through
  # the TLS edge, reasoning_content separated, finish_reason stop.
  #
  # Moved from the mlx engine to mlx-vlm 2026-09-01: mlx-vlm implements
  # nemotron_h (mlx_vlm/models/nemotron_h), so the weights load unchanged and
  # only the serving vocabulary differs.
  #
  # enable_thinking is PRESENT here, unlike the a3b arms and the 122B above.
  # This alias is a reasoning arm today — supports_reasoning: true, tags lifted
  # by the parser — and on mlx-vlm the flag is the whole-child switch, so
  # omitting it would silently turn thinking off and change what this alias is.
  nemotron-3-super:
    engine: mlx-vlm
    model: mlx-community/NVIDIA-Nemotron-3-Super-120B-A12B-5bit
    port: 8080
    venv: ~/.venv-mlx-vlm/bin/mlx_vlm.server
    enable_thinking: true
    supports_reasoning: true
    max_num_seqs: 1
    # 77 GiB cold — see the 122B's readiness_timeout note above.
    readiness_timeout: 600
  qwen3.5-9b:
    engine: mlx-vlm
    model: mlx-community/Qwen3.5-9B-MLX-4bit
    port: 8080
    venv: ~/.venv-mlx-vlm/bin/mlx_vlm.server
    enable_thinking: true
    supports_reasoning: true
    max_num_seqs: 1

  # Gemma 4 E4B (gemma4, MatFormer "effective 4B"). Thinking model, but NOT via
  # <think>: its template opens '<|think|>' and renders tool-call reasoning as
  # '<|channel>thought ... <channel|>'. mlx-vlm handles both natively -
  # _split_thinking tries the tokenizer's own parse_response first and falls
  # back to a marker set that already knows this shape (server/app.py's
  # _count_thinking_tag_tokens names it explicitly).
  #
  # Verified live 2026-09-01 rather than assumed, because a non-<think> thinking
  # model is exactly where the gateway's own ReasoningParser would fail: probed
  # direct on :8081 with --enable-thinking, reasoning_content came back with 658
  # characters, content was bare "391", and no marker leaked into content.
  gemma-4-e4b:
    engine: mlx-vlm
    model: mlx-community/gemma-4-e4b-it-4bit
    port: 8080
    venv: ~/.venv-mlx-vlm/bin/mlx_vlm.server
    enable_thinking: true
    supports_reasoning: true
    max_num_seqs: 1
  muse-glimmer-30b:
    engine: mlx-vlm
    model: mlx-community/Muse-Glimmer-30B-mxfp8
    port: 8080
    venv: ~/.venv-mlx-vlm/bin/mlx_vlm.server
    supports_reasoning: true
    reasoning_effort: medium
    reasoning_effort_values: [high, medium, low, none]
    max_num_seqs: 1
    # 30 GiB cold — same class as the arms above, and a deadline costs nothing.
    readiness_timeout: 600

  # ── 2026-09-01 second band: families, scale pairs, and one novel architecture ──
  # Each was smoke-probed on :8081 before registration, after granite-4.1-8b
  # served 132 samples of token garbage that the harness scored as a clean
  # 0.0% — a broken quant can look well-behaved to an extractor.

  # Devstral Small 2 24B (mistral3). Mistral's agentic-coding specialist, and
  # the second coder family here after qwen3-coder-next. 8bit deliberately,
  # not the far more popular 4bit: coder-next is 6bit, and a 4-vs-6 comparison
  # would confound quantization with model. Probed: 33 completion tokens for a
  # correct fenced answer — terser than any arm on the box.
  devstral-small-2-24b:
    engine: mlx-vlm
    model: mlx-community/Devstral-Small-2-24B-Instruct-2512-8bit
    port: 8080
    venv: ~/.venv-mlx-vlm/bin/mlx_vlm.server
    supports_reasoning: false
    max_num_seqs: 1
    readiness_timeout: 600

  # Gemma 4, the two larger shapes. Same gemma4 template family as
  # gemma-4-e4b, whose <|think|> reasoning split was verified live — these
  # inherit that path rather than being probed for it individually.
  # 26b-a4b is the MoE (A4B active) and the direct scale partner to e4b;
  # 31b is dense and will decode considerably slower.
  gemma-4-26b-a4b:
    engine: mlx-vlm
    model: mlx-community/gemma-4-26b-a4b-it-mxfp8
    port: 8080
    venv: ~/.venv-mlx-vlm/bin/mlx_vlm.server
    enable_thinking: true
    supports_reasoning: true
    max_num_seqs: 1
    readiness_timeout: 600
  nemotron-3-nano-30b-a3b:
    engine: mlx-vlm
    model: mlx-community/NVIDIA-Nemotron-3-Nano-30B-A3B-4bit
    port: 8080
    venv: ~/.venv-mlx-vlm/bin/mlx_vlm.server
    enable_thinking: true
    supports_reasoning: true
    max_num_seqs: 1
    readiness_timeout: 600
  nemotron-3.5-lightning-30b-a3b:
    engine: mlx-vlm
    model: mlx-community/NVIDIA-Nemotron-3.5-Lightning-30B-A3B-mxfp8
    port: 8080
    venv: ~/.venv-mlx-vlm/bin/mlx_vlm.server
    enable_thinking: true
    supports_reasoning: true
    max_num_seqs: 1
    readiness_timeout: 600
  muse-glimmer-30b-mxfp4:
    engine: mlx-vlm
    model: mlx-community/Muse-Glimmer-30B-mxfp4
    port: 8080
    venv: ~/.venv-mlx-vlm/bin/mlx_vlm.server
    supports_reasoning: true
    reasoning_effort: medium
    reasoning_effort_values: [high, medium, low, none]
    max_num_seqs: 1
    readiness_timeout: 600

  # ── The Qwen3.8-27B quant pair: mxfp8 vs mxfp4, one variable ──────────────
  # Registered 2026-09-01 to make the mx-format story a controlled comparison
  # instead of two anecdotes.
  #
  # Why a "plain" mxfp8 twin exists at all when qwen3.8-27b-mxfp8-concurrent1
  # already serves these exact weights: that alias carries an MTP DRAFTER and
  # APC, and concurrent4 carries batching plus a thinking_budget. Speculative
  # decoding changes decode throughput directly, which is the number the
  # format question turns on, so reading a bare mxfp4 arm against concurrent1
  # would confound quantization with speculative decoding. These two differ in
  # the weights and nothing else.
  #
  # APC is dropped from both for symmetry rather than necessity: it caches
  # shared prompt prefixes, so it moves PREFILL only — it cannot change which
  # tokens are generated, and does not touch decode tok/s. Correct to control
  # anyway, but it was never the confound.
  #
  # What this pair is for: both mxfp8 arms measured so far decode at 15.8
  # tok/s while a 77 GiB affine 5-bit Nemotron manages 44-45, yet
  # gemma-4-26b-a4b (mxfp8, A4B active) hits 77.9 — so the penalty tracks
  # ACTIVE parameters, not the format alone.
  #
  # The split is sharp: the two DENSE mxfp8 arms measured (Qwen3.8-27B and
  # Muse Glimmer 30B, whose text tower carries no MoE keys at all — 52 layers,
  # hidden 6656, intermediate 19968) both sit at ~15.8 tok/s, while the two
  # SPARSE ones fly. Qwen3.8-27B pays the tax in full, which makes it the
  # sharpest place to ask what halving the bits buys. The Muse Glimmer pair
  # asks the same of another dense model; this asks it at 27B.
  qwen3.8-27b-mxfp8-plain:
    engine: mlx-vlm
    model: mlx-community/Qwen3.8-27B-mxfp8
    port: 8080
    venv: ~/.venv-mlx-vlm/bin/mlx_vlm.server
    enable_thinking: true
    supports_reasoning: true
    max_num_seqs: 1
    readiness_timeout: 600
  qwen3.8-27b-mxfp4:
    engine: mlx-vlm
    model: mlx-community/Qwen3.8-27B-mxfp4
    port: 8080
    venv: ~/.venv-mlx-vlm/bin/mlx_vlm.server
    enable_thinking: true
    supports_reasoning: true
    max_num_seqs: 1
    readiness_timeout: 600

  # ── Muse Glimmer 30B: the affine half of a 2x2 (format x bit-width) ───────
  # With the two mx arms above this completes a controlled square on one dense
  # model, one uploader, one corpus:
  #
  #            4 bits              8 bits
  #   mx       mxfp4  17.27 GiB    mxfp8  30.27 GiB
  #   affine   4bit   18.08 GiB    8bit   31.08 GiB
  #
  # Reading down a column isolates FORMAT at fixed bit-width; reading across a
  # row isolates BIT-WIDTH at fixed format. The mxfp4/4bit pair is the sharpest
  # of the four comparisons, since 17.27 vs 18.08 GiB is under a gigabyte apart
  # — near-identical memory traffic with the packing scheme as the only
  # meaningful variable.
  #
  # Worth having because the mx penalty measured today is a throughput finding
  # with no accuracy half. Three dense mxfp8 arms sit at 13.9-15.9 tok/s while
  # a same-family MoE at the same quant hits 77.9, and mxfp4 recovers 1.85x of
  # that on this model — but nothing yet says whether mx or affine is BETTER
  # per bit, which is the question that decides what to serve.
  #
  # Naming: the unsuffixed alias is the mxfp8 build and keeps its name for the
  # committed run recorded under it. mx formats carry an mxfp prefix here,
  # affine ones a plain bit name, matching the upstream repos.
  muse-glimmer-30b-8bit:
    engine: mlx-vlm
    model: mlx-community/Muse-Glimmer-30B-8bit
    port: 8080
    venv: ~/.venv-mlx-vlm/bin/mlx_vlm.server
    supports_reasoning: true
    reasoning_effort: medium
    reasoning_effort_values: [high, medium, low, none]
    max_num_seqs: 1
    readiness_timeout: 600
  muse-glimmer-30b-4bit:
    engine: mlx-vlm
    model: mlx-community/Muse-Glimmer-30B-4bit
    port: 8080
    venv: ~/.venv-mlx-vlm/bin/mlx_vlm.server
    supports_reasoning: true
    reasoning_effort: medium
    reasoning_effort_values: [high, medium, low, none]
    max_num_seqs: 1
    readiness_timeout: 600

  # nemotron-3-super at LOW reasoning — the control arm for the biggest
  # confound on the board. Registered 2026-09-02.
  #
  # Measured 2026-09-01: of 21 swept arms, Muse Glimmer is the ONLY one that
  # reasons — ~1,650 characters on 100% of samples, while sixteen arms produce
  # exactly zero. Its 90.9% is therefore a thinking-enabled result sitting in a
  # thinking-disabled band, and its 6.2-point lead over nemotron-3-super (84.7%)
  # cannot be read as a model difference until reasoning is controlled for.
  #
  # Same weights and same config as nemotron-3-super; a SECOND alias exists only
  # because an alias carries one effort fragment, and canary sends "none" to the
  # original. Everything else must stay identical or the pair measures two
  # things at once.
  #
  # Why "low" rather than "high": Muse Glimmer at its floor still emits ~1,650
  # characters, so the honest comparison is a modest reasoning budget, not a
  # maximal one. nemotron is also genuinely gateable — unlike the flash-next
  # arms its enable_thinking is structural — so "low" means what it says here.
  muse-glimmer-30b-abliterated-mxfp4:
    engine: mlx-vlm
    model: shoemoney/Muse-Glimmer-30B-Abliterated-MLX-mxfp4
    port: 8080
    venv: ~/.venv-mlx-vlm/bin/mlx_vlm.server
    # Abliterated — refusal training surgically removed (Falcon-style:
    # the 'refusal direction' zeroed in the residual stream, no
    # instruction-following or reasoning change). Base is
    # Blackfrost-AI/Muse-Glimmer-30B-Abliterated-BF16 via mlx-vlm;
    # same Onyx ATEM channel (to=self→to=user) as the stock
    # Muse-Glimmer aliases above.
    supports_reasoning: true
    reasoning_effort: medium
    reasoning_effort_values: [high, medium, low, none]
    max_num_seqs: 1
    readiness_timeout: 600
  nemotron-3-super-low:
    engine: mlx-vlm
    model: mlx-community/NVIDIA-Nemotron-3-Super-120B-A12B-5bit
    port: 8080
    venv: ~/.venv-mlx-vlm/bin/mlx_vlm.server
    enable_thinking: true
    supports_reasoning: true
    max_num_seqs: 1
    readiness_timeout: 600
